name: Frontend CI/CD

on:
  push:
    branches: [ main, frontend ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: shivamdenge/linkup-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: linkup-app-cluster
          location: ${{ secrets.GKE_REGION || secrets.GKE_ZONE || 'asia-east1' }}
          project_id: ${{ secrets.GCP_PROJECT_ID || 'kubernetes-learn-509206' }}

      - name: Deploy to GKE
        run: |
          kubectl rollout restart deployment/frontend
          kubectl rollout status deployment/frontend --timeout=180s
