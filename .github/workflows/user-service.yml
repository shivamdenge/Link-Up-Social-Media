name: User Service CI/CD

on:
  push:
    branches: [ main, frontend ]
    paths:
      - 'userService/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Push Image with Jib
        working-directory: userService
        run: |
          chmod +x mvnw
          ./mvnw clean compile jib:build \
            -DskipTests \
            -Djib.to.auth.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Djib.to.auth.password=${{ secrets.DOCKERHUB_TOKEN }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: linkup-app-cluster
          location: ${{ secrets.GKE_REGION || secrets.GKE_ZONE || 'asia-east1' }}
          project_id: ${{ secrets.GCP_PROJECT_ID || 'kubernetes-learn-509206' }}

      - name: Deploy to GKE
        run: |
          kubectl rollout restart deployment/user-service
          kubectl rollout status deployment/user-service --timeout=180s
