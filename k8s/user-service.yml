apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: shivamdenge/linkup-user-service
        imagePullPolicy: Always
        resources:
          limits:
            memory: "650Mi"
            cpu: "500m"
          requests:
            memory: "300Mi"
            cpu: "150m"
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: k8s
          - name: DB_USERNAME
            value: user
          - name: DB_PASSWORD
            value: password
          - name: DB_SERVER
            value: user-db
          - name: DB_NAME
            value: userDB
          - name: UPLOADER_SERVICE_URI
            value: http://uploader-service:80
        ports:
        - containerPort: 9020

---

apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-service
  ports:
  - port: 80
    targetPort: 9020
