apiVersion: apps/v1
kind: Deployment
metadata:
  name: posts-service
spec:
  selector:
    matchLabels:
      app: posts-service
  template:
    metadata:
      labels:
        app: posts-service
    spec:
      containers:
      - name: posts-service
        image: shivamdenge/linkup-posts-service
        imagePullPolicy: Always
        resources:
          limits:
            memory: "650Mi"
            cpu: "500m"
          requests:
            memory: "300Mi"
            cpu: "150m"
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: k8s
          - name: DB_USERNAME
            value: user
          - name: DB_PASSWORD
            value: password
          - name: DB_SERVER
            value: posts-db
          - name: DB_NAME
            value: postsDB
        ports:
        - containerPort: 9010

---

apiVersion: v1
kind: Service
metadata:
  name: posts-service
spec:
  selector:
    app: posts-service
  ports:
  - port: 80
    targetPort: 9010
